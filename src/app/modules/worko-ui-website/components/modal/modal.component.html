<ng-template #modalRef let-modal>

    <div *ngIf="showHeader" class="modal-header-class" [class]="headerClass" [ngClass]="{ 'centralized': textCenter }">
  
    </div>
    <div *ngIf="showClose" class="close-icon -pointer" (click)="cancel()">
      <svg width="20" height="20" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M6.153 35.847C4.14728 33.9098 2.54746 31.5926 1.44687 29.0305C0.346277 26.4684 -0.233034 23.7128 -0.257264 20.9244C-0.281494 18.1361 0.249842 15.3708 1.30574 12.79C2.36164 10.2091 3.92095 7.86445 5.8927 5.8927C7.86445 3.92095 10.2091 2.36164 12.79 1.30574C15.3708 0.249842 18.1361 -0.281494 20.9244 -0.257264C23.7128 -0.233034 26.4684 0.346277 29.0305 1.44687C31.5926 2.54746 33.9098 4.14728 35.847 6.153C39.6723 10.1136 41.789 15.4183 41.7411 20.9244C41.6933 26.4306 39.4848 31.6976 35.5912 35.5912C31.6976 39.4848 26.4306 41.6933 20.9244 41.7411C15.4183 41.789 10.1136 39.6723 6.153 35.847ZM23.94 21L29.883 15.057L26.922 12.096L21 18.039L15.057 12.096L12.096 15.057L18.039 21L12.096 26.943L15.057 29.904L21 23.961L26.943 29.904L29.904 26.943L23.961 21H23.94Z"
          fill="#F8F8F8" />
      </svg>
    </div>
  
    <!-- [class]="bodyClass" -->
    <div class="modal-body" [class]="bodyClass" >
      <div *ngIf="message; else contentBlock" [class.text-center]="textCenter" [innerHTML]="message"></div>
      <ng-template #contentBlock>
        <ng-content></ng-content>
      </ng-template>
    </div>
    <div *ngIf="showFooter" class="modal-footer-class theme-k" [class]="footerClass">
      <button type="button" class="btn btn-primary" (click)="modal.close('button')" (click)="redirectClick()">
        Ok
      </button>
      <button *ngIf="showConfirmButton" type="button" class="btn btn-primary ml-3" (click)="modal.close('confirm')">
        Confirm
      </button>
    </div>
  
  </ng-template>
